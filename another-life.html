function beep(f=660,d=.08,type='sine',v=.05){if(!M.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function chime(){beep(523,.12);setTimeout(()=>beep(659,.12),90);setTimeout(()=>beep(784,.2),180)}
function sad(){beep(330,.25,'triangle');setTimeout(()=>beep(262,.4,'triangle'),200)}
const fx=$('#fx'),cx=fx.getContext('2d');let parts=[];
function resize(){fx.width=innerWidth;fx.height=innerHeight}resize();addEventListener('resize',resize);
function confetti(n=90){for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,c:`hsl(${rnd(0,360)} 90% 60%)`,s:rnd(4,8),r:Math.random()*6,l:120});if(parts.length===n)requestAnimationFrame(tick);chime()}
function tick(){cx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.r+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});parts=parts.filter(p=>p.l>0);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,fx.width,fx.height)}

function goBack(){const prev=navStack.pop();if(!prev)return closeSheet();if(prev.parentEntry)navStack=[prev.parentEntry];curNav=prev;beep(420,.05);prev.go()}

function sheet(title,content,forced=false){sheetForced=forced;document.body.classList.add('panel-open');if(curNav&&!curNav.title){curNav.title=title;curNav.forced=forced}$('#sheetTitle').textContent=title;$('#sheetBack').style.display=forced?'none':'';$('#sheetBack').textContent='‹ Back';const b=$('#sheetBody');b.innerHTML='';if(typeof content==='string')b.innerHTML=content;else b.append(content);b.scrollTop=0;$('#sheetClose').style.display=forced?'none':'';$('#sheet').classList.remove('hidden');sheetOpen=true}
let lastMenu=null;const NO_AGAIN=['showCandidate','findDate','startScreen','showDeath','creatorSheet'];
const RAW={};const PARENT_OF={showCandidate:'relSheet',findDate:'relSheet'};
function returnTarget(){const ok=e=>e&&e.title&&!e.forced&&!NO_AGAIN.includes(e.name);if(ok(curNav))return{e:curNav,stack:navStack.filter(ok)};for(let i=navStack.length-1;i>=0;i--)if(ok(navStack[i]))return{e:navStack[i],stack:navStack.slice(0,i).filter(ok)};const p=curNav&&PARENT_OF[curNav.name];if(p&&RAW[p])return{e:{key:p+':',name:p,go:()=>RAW[p](),title:p==='relSheet'?'People ❤️':p,forced:false},stack:[]};return null}
function closeSheet(){const rt=returnTarget();if(rt)lastMenu={title:rt.e.title,go:rt.e.go,name:rt.e.name,stack:rt.stack};$('#sheet').classList.add('hidden');document.body.classList.remove('panel-open');sheetOpen=false;sheetForced=false;navStack=[];curNav=null;render();setTimeout(nextQ,280)}

 // log
 const lg=$('#log');lg.innerHTML='';let cur=null,box;
 S.log.slice(-250).forEach(e=>{if(e.a!==cur){cur=e.a;box=el('div','yr');box.append(el('h4','',`Age ${e.a} · ${S.born+e.a}`));lg.append(box)}box.append(el('div','ent '+e.c,e.t))});
 lg.scrollTop=lg.scrollHeight;
 // stats
 const st=$('#stats');st.innerHTML='';

// ---------- aging ----------
function ageUp(){
 if(sheetOpen)return;
 if(!S.alive)return showDeath();
 PREV=JSON.stringify(S);
 S.age++;S.used={};
 const av=$('#avatar');av.classList.add('bump');setTimeout(()=>av.classList.remove('bump'),400);
 beep(700,.06);setTimeout(()=>beep(900,.06),60);
 yearly();
 fix();
 if(!S.alive){Q=[showDeath];nextQ();return}
 if(S.age>=2&&chance(.6))queueEvent();
 if(chance(.08)&&S.age>=4)queueEvent();
 nextQ();
}

function yearly(){
 const a=S.age;
 // milestones
 if(a===1)log('I took my first steps! 👣');
 if(a===2)log(pick(['My first word was "no".','My first word was "dog".','My first word was "more".']));
 // stats drift
 S.st.happy+=Math.sign(55-S.st.happy)*rnd(0,3)+rnd(-3,3);
 if(a>30)S.st.health-=rnd(0,2);
 if(a>55)S.st.health-=rnd(0,3);
 if(a>75)S.st.health-=rnd(1,4);
 if(a>38&&chance(.4))S.st.looks-=1;
 if(a<18)S.st.smarts+=rnd(0,2);
 if(S.fame>0&&!(S.job&&CAR[S.job.id].fame))S.fame-=rnd(0,3);
 // illness
 if(S.ill){S.st.health-=S.ill.sev;if(chance(.15)){log(`I recovered from ${S.ill.n} on my own.`,'good');S.ill=null}else if(S.st.health<35){log(`⚠️ My ${S.ill.n} is getting worse. I really need to see a doctor!`,'bad');Q.push(()=>toast('⚠️ Your health is failing. Visit a doctor in Activities.'))}}
 else if(chance(a>60?.12:a>40?.06:.035)){const i=pick(ILLS);S.ill={n:i[0],sev:i[1]};log(`I came down with ${i[0]}. 🤒 I should see a doctor.`,'bad');S.st.happy-=4}
 // people
 S.rel.forEach(r=>{if(!r.alive)return;r.age++;if(!['Son','Daughter'].includes(r.role))r.rel=clamp(r.rel-rnd(0,4));
  const p=r.age>70?Math.pow((r.age-70)/32,2)*.7:0.002;
  if(chance(p)){r.alive=false;log(`My ${r.role.toLowerCase()} ${r.name} died at age ${r.age}. 🕊️`,'bad');S.st.happy-=r.rel>60?18:8;sad();
   if(['Mother','Father'].includes(r.role)&&chance(.45)){const inh=has('trust')?rnd(80000,600000):rnd(3000,90000);S.money+=inh;log(`I inherited ${fmt(inh)}.`,'good')}
   if(r.role==='Spouse')log('I am now widowed.','bad')}
  if((r.role==='Son'||r.role==='Daughter')&&r.age===18&&r.alive)log(`${first(r.name)} turned 18 and moved out. 🎓`);
 });
 // pets
 S.pets.forEach(p=>{if(!p.alive)return;p.age++;S.st.happy+=2;if(p.age>p.life||chance(.01)){p.alive=false;log(`My ${p.type.toLowerCase()} ${p.name} passed away. 🌈`,'bad');S.st.happy-=10}});
 // school
 schoolYear();
 // job
 if(S.job){const c=CAR[S.job.id],lv=c.lv[S.job.lvl];const pay=lv[1]*(1+S.job.years*.015);S.money+=pay*.72;S.job.years++;
  S.job.perf=clamp(S.job.perf+rnd(-10,7)+(S.st.smarts-50)/20+(S.st.happy-50)/25);
  if(c.fame)S.fame+=rnd(1,3)+S.job.lvl*3;
  if(S.job.perf>62&&S.job.lvl<c.lv.length-1&&chance(.3+L()+(S.job.perf-62)/120)){promote()}
  else if(S.job.perf<15&&chance(.55)){log(`I was fired from my job as ${lv[0]}. 📦`,'bad');S.job=null;S.st.happy-=15}}
 if(S.retired)S.money+=S.retired;
 // expenses
 if(a>=18){let cost=0;const home=S.assets.some(x=>x.kind==='house');
  if(!(S.school&&S.school.type!=='High School'))cost+=home?9000:19000;
  else cost+=6000;
  const p=partner();if(p&&p.role==='Spouse')cost*=.7;
  cost+=kids().filter(k=>k.alive&&k.age<18).length*9000;
  cost+=S.pets.filter(p=>p.alive).length*600;
  S.money-=cost;
  if(S.debt>0){S.debt*=1.05;const pay=Math.min(S.debt,Math.max(6000,S.debt*.1));if(S.money>pay){S.money-=pay;S.debt-=pay}else S.st.happy-=3;if(S.debt<1)S.debt=0}
  if(S.money<0){S.st.happy-=5;if(chance(.5))log('Bills are piling up. I am in the red. 😬','bad')}}
 S.assets.forEach(x=>{if(x.kind==='house')x.val*=1+rnd(-4,8)/100;else x.val*=.88;S.st.happy+=x.kind==='house'?1:.5});
 S.biz.forEach(b=>{const pr=b.val*(rnd(-14,24)+b.mgmt)/100;S.money+=pr;b.val*=1+rnd(-8,14)/100;b.mgmt=Math.max(0,b.mgmt-2);
  if(b.name==='Tech Startup'&&!b.ipo&&chance(.04+L()/3)){b.ipo=1;b.val*=20;log(`🚀 My Tech Startup went public! It is now worth ${fmt(b.val)}.`,'big');Q.push(()=>{confetti();toast('IPO! 🚀')})}
  else if(pr<-b.val*.08)log(`${b.icon} ${b.name} had a rough year (${fmt(pr)}).`,'bad')});
 // death
 let p=0;if(S.st.health<=0)p=1;else if(a>65)p=Math.pow((a-65)/40,2)*(1.3-S.st.health/100);if(a>=118)p=1;

 S.school.left--;S.school.perf=clamp(S.school.perf+rnd(-8,6)+(S.st.smarts-50)/12);

 ['gen','🌳','Dynasty','Play a 3rd generation',20,()=>S.gen>=3],
];
function checkAch(){if(!S)return;ACH.forEach(([id,ic,n,d,pts,f])=>{if(S.achs.includes(id))return;let ok=false;try{ok=f()}catch(e){}if(!ok)return;S.achs.push(id);const firstTime=!M.ach[id];M.ach[id]=1;const g=firstTime?pts:3;M.points+=g;log(`🏆 Ribbon earned: ${n} (+${g} ⭐)`,'big');setTimeout(()=>toast(`🏆 ${n}  +${g} ⭐`),300)});saveMeta()}
function achSheet(){const w=el('div');w.append(el('div','info',`Ribbons this life: <b>${S.achs.length}</b> · All-time: <b>${Object.keys(M.ach).length}/${ACH.length}</b> · Lives lived: <b>${M.lives}</b>`));ACH.forEach(([id,ic,n,d,pts])=>w.append(opt(M.ach[id]?ic:'⬜',n,d,()=>{},{rt:S.achs.includes(id)?'✅ this life':M.ach[id]?'earned':`⭐ ${pts}`,cls:M.ach[id]?'':'locked'})));sheet('Ribbons 🏆',w)}
function creatorSheet(){const w=el('div');['health','happy','smarts','looks'].forEach(k=>{w.append(el('label','lb',`${k} <span id="cv_${k}">${S.st[k]}</span>`));const r=el('input');r.type='range';r.min=0;r.max=100;r.value=S.st[k];r.oninput=()=>{S.st[k]=+r.value;$('#cv_'+k).textContent=r.value};w.append(r)});
 [['karma','Karma'],['fame','Fame']].forEach(([k,l])=>{w.append(el('label','lb',`${l} <span id="cv_${k}">${S[k]}</span>`));const r=el('input');r.type='range';r.min=0;r.max=100;r.value=S[k];r.oninput=()=>{S[k]=+r.value;$('#cv_'+k).textContent=r.value};w.append(r)});
 w.append(el('label','lb','Cash'));const m=el('input');m.type='number';m.value=Math.round(S.money);w.append(m);
 if(S.ill)w.append(opt('💊','Cure illness','',()=>{S.ill=null;toast('Cured!')}));
 w.append(opt('','Save changes','',()=>{S.money=+m.value||0;log('🪄 Reality shifted slightly.');fix();closeSheet()},{cls:'primary'}));sheet('Creator Mode 🪄',w)}

// ---------- death / start ----------
function showDeath(){
 if(!S.paid){S.paid=true;const nw=net();const pts=Math.floor(S.age/4)+(nw>=1e6?10:0)+(nw>=1e8?20:0)+S.achs.length*2;S.earned=pts;M.points+=pts;M.lives++;M.best=Math.max(M.best||0,S.age);saveMeta();save();sad()}
 const w=el('div');const job=S.job?CAR[S.job.id].lv[S.job.lvl][0]:S.retired?'a retiree':S.jobsHeld.length?'between jobs':'never worked';
 const k=kids();const p=S.rel.find(r=>r.role==='Spouse');
 w.append(el('div','evt-icon','🪦'));
 w.append(el('div','obit',`<b>${S.name}</b><br>${S.born} – ${year()}<br><br>Died at age ${S.age} from ${S.cause}.<br>${S.job?'Worked as '+job:'Career: '+job}. Net worth ${fmt(net())}.${p?'<br>Survived by spouse '+first(p.name)+'.':''}${k.length?`<br>Parent of ${k.length} ${k.length===1?'child':'children'}.`:''}`));
 const ribs=S.achs.map(id=>ACH.find(a=>a[0]===id)).filter(Boolean);
 w.append(el('div','info',`<b>Life summary</b><br>${S.degrees.filter(d=>d!=='HS').map(d=>`<span class="pill">🎓 ${GRAD[d]?GRAD[d].n:d}</span>`).join('')}${ribs.map(r=>`<span class="pill">${r[1]} ${r[2]}</span>`).join('')||'<span class="pill">No ribbons this time</span>'}<br><br>⭐ Life Points earned: <b>+${S.earned||0}</b> (total ${M.points})`));
 const heir=k.filter(c=>c.alive).sort((a,b)=>b.age-a.age)[0];
 if(heir)w.append(opt('🌳',`Continue as ${heir.name}`,`Age ${heir.age} · inherits ${fmt(Math.max(0,net())*.6)}`,()=>continueAs(heir),{cls:'primary'}));
 w.append(opt('👶','Start a new life','',()=>{closeSheet();startScreen()},{cls:heir?'':'primary'}));
 w.append(opt('⭐','Spend Life Points','',upgradeSheet));
 sheet('Rest in Peace',w,true)}
function continueAs(h){const inh=Math.max(0,net())*.6;const deceased=S;const spouse=S.rel.find(r=>r.role==='Spouse'&&r.alive);const gen=S.gen+1;const parts=h.name.split(' ');
 newLife({name:h.name,gender:h.gender,last:parts[parts.length-1],city:deceased.city,born:deceased.born+deceased.age-h.age,gen,noFamily:true});
 S.age=h.age;S.money+=inh;S.st.smarts=clamp(S.st.smarts);
 S.rel.push({id:uid(),name:deceased.name,role:deceased.gender==='male'?'Father':'Mother',gender:deceased.gender,age:deceased.age,rel:h.rel,alive:false});
 if(spouse)S.rel.push({...spouse,role:spouse.gender==='male'?'Father':'Mother',rel:rnd(50,90)});
deceased.rel.filter(r=>(r.role==='Son'||r.role==='Daughter')&&r.id!==h.id).forEach(s=>S.rel.push({...s,role:s.gender==='male'?'Brother':'Sister',rel:rnd(40,80)}));
 const a=S.age;if(a>=5&&a<11)S.school={type:'Elementary School',left:11-a,perf:60};else if(a>=11&&a<14)S.school={type:'Middle School',left:14-a,perf:60};else if(a>=14&&a<18)S.school={type:'High School',left:18-a,perf:60};
 if(a>=18)S.degrees.push('HS');if(a>=23&&chance(.6))S.degrees.push(pick(MAJORS));
 if(a>=22&&chance(.7)){const opts=CAREER_LIST.filter(c=>!meets(c).length&&!c.fame);if(opts.length){const c=pick(opts);S.job={id:c.id,lvl:Math.min(c.lv.length-1,Math.floor((a-22)/10)),perf:55,years:rnd(1,8)};S.jobsHeld.push(c.id)}}
 log(`I am ${S.name}, child of ${deceased.name}. Generation ${gen} begins. 🌳`,'big');
 log(`I inherited ${fmt(inh)} from my parent's estate.`,'good');
 checkAch();save();closeSheet();render()}
function startScreen(){const w=el('div');w.append(el('div','title','Another Life'));w.append(el('div','tag','Every choice writes your story. One year at a time.'));
 let g=pick(['male','female']);
 w.append(el('label','lb','Gender'));const gs=el('select');gs.innerHTML='<option value="male">Male</option><option value="female">Female</option>';gs.value=g;w.append(gs);
 w.append(el('label','lb','First name'));const fn=el('input');fn.type='text';fn.value=pick(g==='male'?MALE:FEMALE);w.append(fn);
 w.append(el('label','lb','Last name'));const ln=el('input');ln.type='text';ln.value=pick(LAST);w.append(ln);
 w.append(el('label','lb','Birthplace'));const cs=el('select');cs.innerHTML=CITIES.map(c=>`<option>${c}</option>`).join('');cs.value=pick(CITIES);w.append(cs);
 gs.onchange=()=>{fn.value=pick(gs.value==='male'?MALE:FEMALE)};
 const stats={};
 if(has('creator')){w.append(sec('🪄 Creator Mode: design your stats'));['health','happy','smarts','looks'].forEach(k=>{stats[k]=rnd(50,90);w.append(el('label','lb',`${k} <span id="sv_${k}">${stats[k]}</span>`));const r=el('input');r.type='range';r.min=0;r.max=100;r.value=stats[k];r.oninput=()=>{stats[k]=+r.value;$('#sv_'+k).textContent=r.value};w.append(r)})}
 w.append(opt('🎲','Randomize','',()=>{gs.value=pick(['male','female']);fn.value=pick(gs.value==='male'?MALE:FEMALE);ln.value=pick(LAST);cs.value=pick(CITIES)}));
 w.append(opt('','Be born ✨','',()=>{newLife({name:(fn.value.trim()||'Alex')+' '+(ln.value.trim()||'Smith'),gender:gs.value,last:ln.value.trim()||'Smith',city:cs.value,stats:has('creator')?stats:null});closeSheet()},{cls:'primary'}));
 w.append(opt('⭐',`Upgrades (${M.sandbox?'∞':M.points} points)`,'Spend Life Points before you start',upgradeSheet));
 sheet('New Life',w,true)}

// ---------- wiring ----------
$('#ageBtn').onclick=()=>{if(sheetOpen&&isSide()&&!sheetForced)closeSheet();ageUp()};
$('#againBtn').onclick=()=>{if(sheetOpen||!lastMenu||!S.alive)return;const m=lastMenu;beep(520,.05);curNav={key:'again:'+m.name,name:m.name,go:m.go,title:null};navStack=(m.stack||[]).slice();if(!navStack.length&&lastSub[m.name]&&lastSub[m.name].title)navStack=[Object.assign({},lastSub[m.name],{parentEntry:{key:'p:'+m.name,name:m.name,go:m.go,title:m.title,forced:false}})];m.go()};
document.querySelectorAll('nav button[data-a]').forEach(b=>b.onclick=()=>{if(!S)return;if(sheetOpen){if(isSide()&&!sheetForced)closeSheet();else return}if(!S.alive)return showDeath();({job:jobSheet,assets:assetSheet,rel:relSheet,act:actSheet})[b.dataset.a]()});
$('#btnUp').onclick=()=>upgradeSheet();
$('#btnAch').onclick=()=>S&&achSheet();
$('#btnSide').onclick=()=>{M.side=!M.side;saveMeta();applySide();toast(!M.side?'Side view off.':WIDE()?'Side view on: menus open next to your game.':'Side view is on, but this screen is too narrow. Turn your device sideways or widen the window.')};
addEventListener('resize',applySide);applySide();
$('#btnSound').onclick=()=>{M.sound=!M.sound;saveMeta();render()};
$('#btnNew').onclick=()=>{const w=el('div');w.append(el('p','evt-text','Abandon this life and start over?'));w.append(opt('','Yes, start a new life','',()=>{closeSheet();setTimeout(startScreen,300)},{cls:'primary'}));w.append(opt('','Keep living','',closeSheet));sheet('New life?',w)};
$('#btnRewind').onclick=()=>{if(!has('rewind'))return;if(!PREV)return toast('Nothing to rewind yet.');if(S.rewinds<=0)return toast('No rewinds left this life.');const r=S.rewinds-1;S=JSON.parse(PREV);S.rewinds=r;PREV=null;Q=[];if(sheetOpen){$('#sheet').classList.add('hidden');sheetOpen=false}log('⏪ I went back in time...');beep(300,.3,'sawtooth');save();render()};
$('#btnCreator').onclick=()=>{if(S&&S.alive&&!sheetOpen)creatorSheet()};
addEventListener('keydown',e=>{if(e.key===' '&&!sheetOpen&&document.activeElement.tagName!=='INPUT'){e.preventDefault();ageUp()}});

// back-button navigation: wrap every menu
jobSheet=nav('jobSheet',jobSheet);
assetSheet=nav('assetSheet',assetSheet);
RAW.relSheet=relSheet;relSheet=nav('relSheet',relSheet);
actSheet=nav('actSheet',actSheet);
personSheet=nav('personSheet',personSheet);
findDate=nav('findDate',findDate);
showCandidate=nav('showCandidate',showCandidate);
bizSheet=nav('bizSheet',bizSheet);
vacSheet=nav('vacSheet',vacSheet);
uniOfferAdult=nav('uniOfferAdult',uniOfferAdult);
gradOffer=nav('gradOffer',gradOffer);
upgradeSheet=nav('upgradeSheet',upgradeSheet);
achSheet=nav('achSheet',achSheet);
creatorSheet=nav('creatorSheet',creatorSheet);
startScreen=nav('startScreen',startScreen);
showDeath=nav('showDeath',showDeath);
// boot
const saved=store.get('al_life');
if(saved&&saved.alive){S=saved;render();toast(`Welcome back, ${first(S.name)}!`)}
else{S={name:'Another Life',gender:'male',age:0,born:2026,city:'',alive:true,st:{health:50,happy:50,smarts:50,looks:50},fame:0,karma:50,money:0,debt:0,log:[],school:null,degrees:[],job:null,rel:[],assets:[],biz:[],pets:[],used:{},achs:[],jobsHeld:[],gen:1};render();startScreen()}
</script>
