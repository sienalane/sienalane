<style>
:root{--hue:210;--bg1:hsl(var(--hue) 45% 14%);--bg2:hsl(calc(var(--hue) + 40) 50% 8%);--card:hsl(var(--hue) 30% 18% / .85);--line:hsl(var(--hue) 30% 30% / .6);--txt:#eef3fb;--mut:#9fb0c8;--acc:hsl(calc(var(--hue) + 150) 80% 60%);--good:#4ade80;--mid:#facc15;--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);background:radial-gradient(1200px 800px at 20% -10%,hsl(var(--hue) 60% 30% / .55),transparent 60%),radial-gradient(900px 700px at 110% 110%,hsl(calc(var(--hue) + 80) 60% 30% / .45),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:--hue 1s;overflow:hidden}
#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:10px 10px 0}
header{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px;backdrop-filter:blur(10px)}
#avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,hsl(var(--hue) 70% 55%),hsl(calc(var(--hue) + 60) 70% 50%));box-shadow:0 0 0 3px hsl(var(--hue) 60% 70% / .3),0 8px 20px #0006;flex:none;transition:transform .4s}
#avatar.bump{transform:scale(1.15) rotate(-6deg)}
.who{flex:1;min-width:0}
#pname{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#psub{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{text-align:right}
#pmoney{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;color:var(--good)}
#pmoney.neg{color:var(--bad)}
.tiny{font-size:11px;color:var(--mut)}
#toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#toolbar button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font:600 13px Nunito;cursor:pointer}
#btnGames{flex:none;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font:600 13px Nunito;text-decoration:none}#btnGames:hover,#toolbar button:hover{border-color:var(--acc)}
#toolbar .hidden{display:none}
.badge{background:var(--acc);color:#111;border-radius:999px;padding:0 7px;margin-left:4px;font-weight:800}
#log{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;scroll-behavior:smooth;backdrop-filter:blur(10px)}
.yr{margin-bottom:12px}
.yr h4{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;color:var(--acc);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.yr h4::after{content:"";flex:1;height:1px;background:var(--line)}
.ent{font-size:14.5px;line-height:1.45;padding:2px 0;animation:fadein .5s both}
.ent.good{color:#b6f5c8}.ent.bad{color:#fdb4b4}.ent.big{font-weight:800;color:#fff3b0}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px;margin-top:8px}
.stat{font-size:12px;font-weight:700}
.stat .row{display:flex;justify-content:space-between;margin-bottom:3px}
.bar{height:8px;border-radius:99px;background:#ffffff18;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s,background .6s}
nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:4px;padding:10px 0 12px}
nav button{background:none;border:none;color:var(--txt);font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px}
nav button span{font:700 11px Nunito;color:var(--mut)}
nav button:hover{background:#ffffff10}
#ageBtn{width:76px;height:76px;margin:-26px auto 0;border-radius:50%;background:linear-gradient(135deg,hsl(calc(var(--hue) + 150) 85% 58%),hsl(calc(var(--hue) + 190) 85% 50%));font:700 38px Fredoka;color:#0b1220;box-shadow:0 10px 30px hsl(calc(var(--hue) + 150) 80% 50% / .5);animation:pulse 2.4s infinite;line-height:1}
#ageBtn span{color:#0b1220;font-size:11px;margin-top:-6px}
#ageBtn:hover{background:linear-gradient(135deg,hsl(calc(var(--hue) + 150) 90% 65%),hsl(calc(var(--hue) + 190) 90% 58%))}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px hsl(calc(var(--hue) + 150) 80% 50% / .45),0 0 0 0 hsl(calc(var(--hue) + 150) 80% 60% / .5)}50%{box-shadow:0 10px 30px hsl(calc(var(--hue) + 150) 80% 50% / .45),0 0 0 12px transparent}}
#againBtn{align-self:center;margin-top:8px;background:var(--card);border:1px solid var(--acc);color:var(--txt);border-radius:999px;padding:7px 16px;font:600 14px Fredoka;cursor:pointer;animation:fadein .4s both;box-shadow:0 4px 14px #0005}#againBtn:hover{background:hsl(var(--hue) 35% 26%)}#againBtn.hidden{display:none}
#sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20;transition:opacity .25s}
#sheet.hidden{opacity:0;pointer-events:none}
.sheet-inner{width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;background:linear-gradient(180deg,hsl(var(--hue) 35% 20%),hsl(var(--hue) 40% 12%));border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:16px;transform:translateY(0);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
#sheet.hidden .sheet-inner{transform:translateY(100%)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{font:600 21px Fredoka}
#sheetBack{background:#ffffff1f;border:1px solid var(--line);color:var(--txt);height:34px;padding:0 14px;border-radius:999px;font:600 15px Fredoka;line-height:1;white-space:nowrap;cursor:pointer;margin-right:10px;flex:none}#sheetBack:hover,#sheetClose:hover{background:#ffffff28}.sheet-head h2{flex:1}
#sheetClose{background:#ffffff15;border:none;color:var(--txt);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
#sheetBody{overflow-y:auto;padding-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#ffffff0d;border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:11px 13px;margin-bottom:7px;cursor:pointer;font:600 15px Nunito;transition:transform .1s,border-color .2s,background .2s}
.opt:hover{border-color:var(--acc);background:#ffffff16}
.opt:active{transform:scale(.98)}
.opt .ic{font-size:24px;width:30px;text-align:center;flex:none}
.opt .tx{flex:1;min-width:0}
.opt .sub{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:1px}
.opt .rt{font-size:13px;color:var(--mut);text-align:right;flex:none}
.opt.locked{opacity:.5}
.opt.primary{background:linear-gradient(135deg,hsl(calc(var(--hue) + 150) 80% 55%),hsl(calc(var(--hue) + 190) 80% 48%));color:#0b1220;justify-content:center;font-weight:800;border:none}
.opt.danger{border-color:#f8717166;color:#fecaca}
.sec{font:600 13px Fredoka;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:14px 0 7px}
.evt-icon{font-size:56px;text-align:center;margin:4px 0 8px;animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.evt-text{font-size:16.5px;line-height:1.5;margin-bottom:14px;text-align:center}
.info{background:#ffffff0d;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:14px;line-height:1.5}
.info b{font-family:Fredoka;font-weight:600}
input[type=text],input[type=number],select{width:100%;background:#ffffff12;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font:600 15px Nunito;margin-bottom:10px}
select option{background:#1b2638}
label.lb{font-size:12px;font-weight:800;color:var(--mut);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
input[type=range]{width:100%;accent-color:var(--acc);margin-bottom:8px}
.title{font:700 40px Fredoka;text-align:center;background:linear-gradient(90deg,#fff,hsl(calc(var(--hue) + 150) 90% 70%));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;color:var(--mut);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120px);background:hsl(var(--hue) 40% 22%);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;font-weight:700;z-index:40;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:90vw;text-align:center;box-shadow:0 10px 30px #0008}
#toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pill{display:inline-block;background:#ffffff15;border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.obit{font-family:Fredoka;font-size:17px;line-height:1.5;text-align:center;margin-bottom:12px}
#glance{display:none;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px 14px;margin-bottom:14px;backdrop-filter:blur(10px)}
#btnWide.on{border-color:var(--acc);color:var(--acc)}
.mini{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}.mini b{font-family:Fredoka;font-weight:600}
@media (min-width:1000px){
 body.wide #app{max-width:1500px;display:grid;grid-template-columns:310px minmax(0,1fr) 360px;grid-template-rows:auto auto auto 1fr auto auto;grid-template-areas:"head log glance" "tool log glance" "stats log glance" ". log glance" "again log glance" "nav log glance";column-gap:16px;padding:14px 16px 0}
 body.wide header{grid-area:head;flex-wrap:wrap;row-gap:4px}
 body.wide .money{flex-basis:100%;display:flex;gap:10px;align-items:baseline;justify-content:flex-start;text-align:left;padding-left:70px}
 body.wide #toolbar{grid-area:tool}
 body.wide #log{grid-area:log;margin-bottom:14px}
 body.wide #stats{grid-area:stats;grid-template-columns:1fr;margin-top:0}
 body.wide #againBtn{grid-area:again;justify-self:center;margin-bottom:6px}
 body.wide nav{grid-area:nav}
 body.wide #glance{grid-area:glance;display:block}
 body.wide #sheet{inset:14px max(16px,calc((100vw - 1500px) / 2 + 16px)) 14px auto;width:410px;background:none;align-items:stretch;transition:opacity .3s,transform .45s cubic-bezier(.2,.9,.3,1)}
 body.wide #sheet.hidden{transform:translateX(60px)}
 body.wide .sheet-inner{max-height:none;height:100%;border-radius:24px;border-bottom:1px solid var(--line);transform:none!important;box-shadow:0 20px 50px #0008}
}
body.glance-free #glance{display:block;position:fixed;top:var(--vidh,40vh);bottom:12px;width:min(440px,calc(100vw - max(480px,var(--dockw,52vw)) - 40px));margin:0;z-index:5;animation:fadein .4s both}
body.glance-free.dock-left #glance{right:10px}
body.glance-free.dock-right #glance{left:10px}
#btnDock.on{border-color:var(--acc);color:var(--acc)}
@media (min-width:600px){
 body.dock-left #app{margin-left:10px!important;margin-right:auto!important;max-width:max(480px,var(--dockw,52vw))!important}
 body.dock-right #app{margin-right:10px!important;margin-left:auto!important;max-width:max(480px,var(--dockw,52vw))!important}
 body.dock-left #sheet{right:auto;width:max(500px,calc(var(--dockw,52vw) + 20px))}
 body.dock-right #sheet{left:auto;width:max(500px,calc(var(--dockw,52vw) + 20px))}
 body.dock-left .sheet-inner,body.dock-right .sheet-inner{max-width:calc(100% - 20px)}
}
@media (min-width:1300px){
 body.dock-left #app,body.dock-right #app{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto auto;grid-template-areas:"head log" "tool log" "stats log" ". log" "again log" "nav log";column-gap:16px;padding:14px 0 0}
 body.dock-left header,body.dock-right header{grid-area:head;flex-wrap:wrap;row-gap:4px}
 body.dock-left .money,body.dock-right .money{flex-basis:100%;display:flex;gap:10px;align-items:baseline;text-align:left;padding-left:70px}
 body.dock-left #toolbar,body.dock-right #toolbar{grid-area:tool}
 body.dock-left #log,body.dock-right #log{grid-area:log;margin-bottom:14px}
 body.dock-left #stats,body.dock-right #stats{grid-area:stats;grid-template-columns:1fr;margin-top:0}
 body.dock-left #againBtn,body.dock-right #againBtn{grid-area:again;justify-self:center;margin-bottom:6px}
 body.dock-left nav,body.dock-right nav{grid-area:nav}
}
#btnSide.on{border-color:var(--acc);color:var(--acc)}
@media (min-width:760px){
 body.side #app{margin-left:calc((100vw - min(520px,100vw)) / 2);transition:margin-left .45s cubic-bezier(.2,.9,.3,1),max-width .45s cubic-bezier(.2,.9,.3,1)}
 body.side.panel-open #app{max-width:min(520px,calc(50vw - 20px));margin-left:calc(50vw - min(520px,calc(50vw - 20px)) - 5px)}
 body.side #sheet{inset:10px auto 12px calc(50vw + 5px);width:min(480px,calc(50vw - 20px));background:none;align-items:stretch;transition:opacity .3s,transform .45s cubic-bezier(.2,.9,.3,1)}
 body.side #sheet.hidden{transform:translateX(70px)}
 body.side .sheet-inner{max-height:none;height:100%;border-radius:24px;border-bottom:1px solid var(--line);transform:none!important;box-shadow:0 20px 50px #0007}
}
</style>

// ---------- aging ----------
function quietYear(){if(!S.alive||S.log.some(l=>l.a===S.age))return;const a=S.age;const L0=a<3?['I mostly napped, ate and babbled.','I learned to clap. Everyone was thrilled.','I discovered my toes.']:a<6?['I spent the year playing pretend and asking "why?" about everything.','I built a blanket fort and refused to leave it.','I learned my ABCs (mostly).','I fell in love with a stuffed animal named '+pick(['Mr. Buttons','Bun Bun','Sir Fluff','Pickles'])+'.']:a<13?['It was a quiet year of homework and cartoons.','I spent the summer riding bikes with neighborhood kids.','I collected '+pick(['rocks','Pokémon cards','stickers','seashells'])+' all year.','Nothing big happened. I grew two inches.']:a<20?['A pretty normal teenage year. School, friends, drama.','I spent most of the year texting my friends.','I went through a '+pick(['punk','emo','preppy','skater'])+' phase.']:a<60?['A quiet, steady year.','Work, sleep, repeat. Not a bad year.','I tried a new coffee shop and made it my regular spot.','I binge-watched three whole TV series.','Nothing major happened, and honestly that was nice.']:['A peaceful year.','I spent a lot of time in the garden.','I told the same stories at every family dinner.','I took up crossword puzzles.'];log(pick(L0))}
function ageUp(){
 if(sheetOpen)return;
 if(!S.alive)return showDeath();
 PREV=JSON.stringify(S);
 S.age++;S.used={};
 const av=$('#avatar');av.classList.add('bump');setTimeout(()=>av.classList.remove('bump'),400);
 beep(700,.06);setTimeout(()=>beep(900,.06),60);
 yearly();
 quietYear();
 fix();
 if(!S.alive){Q=[showDeath];nextQ();return}
 if(S.jail){if(chance(.6))queuePrisonEvent()}else if(S.job&&chance(.55))queueJobEvent();
 if(!S.jail&&S.age>=4)queueNPC();
 if(!S.jail)faithYear();
 if(!S.jail)tvYear();
 if(!S.jail&&S.school&&S.school.club&&chance(.5))queueSchoolEvent();
 if(!S.jail&&S.age>=2&&chance(S.job?.4:.6))queueEvent();
 if(chance(.08)&&S.age>=4)queueEvent();
 nextQ();
}

function yearly(){
 const a=S.age;
 premiumYear();
 if(S.preg&&S.age>S.preg.age){S.preg=null;Q.push(()=>nameBabySheet(0))}
 // milestones
 if(a===1)log('I took my first steps! 👣');
 if(a===2)log(pick(['My first word was "no".','My first word was "dog".','My first word was "more".']));
 // stats drift
 S.st.happy+=Math.sign(55-S.st.happy)*rnd(0,3)+rnd(-3,3);
 if(a>30)S.st.health-=rnd(0,2);
 if(a>55)S.st.health-=rnd(0,3);
 if(a>75)S.st.health-=rnd(1,4);
 if(a>38&&chance(.4))S.st.looks-=1;
 if(a<18)S.st.smarts+=rnd(0,2);
 if(S.fame>0&&!(S.job&&CAR[S.job.id].fame))S.fame-=rnd(0,3);
 // illness
 if(S.ill){S.st.health-=S.ill.sev;if(chance(.15)){log(`I recovered from ${S.ill.n} on my own.`,'good');S.ill=null}else if(S.st.health<35){log(`⚠️ My ${S.ill.n} is getting worse. I really need to see a doctor!`,'bad');Q.push(()=>toast('⚠️ Your health is failing. Visit a doctor in Activities.'))}}
 else if(chance(a>60?.12:a>40?.06:.035)){const i=pick(ILLS);S.ill={n:i[0],sev:i[1]};log(`I came down with ${i[0]}. 🤒 I should see a doctor.`,'bad');S.st.happy-=4}
 // people
 S.rel.forEach(r=>{if(!r.alive)return;r.age++;if(!['Son','Daughter','Grandson','Granddaughter'].includes(r.role))r.rel=clamp(r.rel-rnd(0,4));
  const p=r.age>70?Math.pow((r.age-70)/32,2)*.7:0.002;
  if(chance(p)){r.alive=false;log(`My ${r.role.toLowerCase()} ${r.name} died at age ${r.age}. 🕊️`,'bad');S.st.happy-=r.rel>60?18:8;sad();
   if(['Mother','Father'].includes(r.role)&&chance(.45)){const inh=has('trust')?rnd(80000,600000):rnd(3000,90000);S.money+=inh;log(`I inherited ${fmt(inh)}.`,'good')}
   if(r.role==='Spouse')log('I am now widowed.','bad')}
  if((r.role==='Son'||r.role==='Daughter')&&r.age===18&&r.alive)log(`${first(r.name)} turned 18 and moved out. 🎓`);
 });
 // pets
 S.pets.forEach(p=>{if(!p.alive)return;p.age++;S.st.happy+=2;if(p.age>p.life||chance(.01)){p.alive=false;log(`My ${p.type.toLowerCase()} ${p.name} passed away. 🌈`,'bad');S.st.happy-=10}});
 // school
 schoolYear();
 // job
 if(S.job){const c=CAR[S.job.id],lv=c.lv[S.job.lvl];const pay=lv[1]*(1+S.job.years*.015);S.money+=pay*.72;S.job.years++;
  S.job.perf=clamp(S.job.perf+rnd(-10,7)+(S.st.smarts-50)/20+(S.st.happy-50)/25);
  if(c.fame)S.fame+=rnd(1,3)+S.job.lvl*3;
  if(S.job.perf>62&&S.job.lvl<c.lv.length-1&&chance(.3+L()+(S.job.perf-62)/120)){promote()}
  else if(S.job.perf<15&&chance(.55)){log(`I was fired from my job as ${lv[0]}. 📦`,'bad');S.job=null;S.st.happy-=15}}
 if(S.retired)S.money+=S.retired;
 // expenses
 if(a>=18&&!S.jail){let cost=0;const home=S.assets.some(x=>x.kind==='house');
  if(!(S.school&&S.school.type!=='High School'))cost+=home?9000:19000;
  else cost+=6000;
  const p=partner();if(p&&p.role==='Spouse')cost*=.7;
  cost+=kids().filter(k=>k.alive&&k.age<18).length*9000;
  cost+=S.pets.filter(p=>p.alive).length*600;
  S.money-=cost;
  if(S.debt>0){S.debt*=1.05;const pay=Math.min(S.debt,Math.max(6000,S.debt*.1));if(S.money>pay){S.money-=pay;S.debt-=pay}else S.st.happy-=3;if(S.debt<1)S.debt=0}
  if(S.money<0){S.st.happy-=5;if(chance(.5))log('Bills are piling up. I am in the red. 😬','bad')}}
 S.assets.forEach(x=>{if(x.kind==='house')x.val*=1+rnd(-4,8)/100;else x.val*=.88;S.st.happy+=x.kind==='house'?1:.5});
 S.biz.forEach(b=>{const pr=b.val*(rnd(-14,24)+b.mgmt)/100;S.money+=pr;b.val*=1+rnd(-8,14)/100;b.mgmt=Math.max(0,b.mgmt-2);
  if(b.name==='Tech Startup'&&!b.ipo&&chance(.04+L()/3)){b.ipo=1;b.val*=20;log(`🚀 My Tech Startup went public! It is now worth ${fmt(b.val)}.`,'big');Q.push(()=>{confetti();toast('IPO! 🚀')})}
  else if(pr<-b.val*.08)log(`${b.icon} ${b.name} had a rough year (${fmt(pr)}).`,'bad')});
 // death
 let p=0;if(S.st.health<=0)p=1;else if(a>65)p=Math.pow((a-65)/40,2)*(1.3-S.st.health/100);if(a>=118)p=1;
 if(chance(p))die(S.st.health<=0?(S.ill?S.ill.n:'poor health'):pick(['old age','heart failure','natural causes','a peaceful sleep']));
}

function promote(){const c=CAR[S.job.id];S.job.lvl++;S.job.perf=Math.max(35,S.job.perf-25);const t=c.lv[S.job.lvl][0];log(`I was promoted to ${t}! 🎊`,'big');S.st.happy+=8;Q.push(()=>{confetti();toast(`Promoted: ${t}`)})}

function schoolYear(){
 const a=S.age;
 if(a===5&&!S.school){S.school={type:'Elementary School',left:6,perf:60};log('I started elementary school. 🎒')}
 if(!S.school||a===5)return;
 S.school.left--;S.school.perf=clamp(S.school.perf+rnd(-8,6)+(S.st.smarts-50)/12);
 if(S.school.left>0)return;
 const t=S.school.type;
 if(t==='Elementary School'){S.school={type:'Middle School',left:3,perf:60};log('I started middle school.')}
 else if(t==='Middle School'){S.school={type:'High School',left:4,perf:60};log('I started high school. 🏫')}
 else if(t==='High School'){S.degrees.push('HS');S.school=null;log('I graduated from high school! 🎓','big');Q.push(()=>{confetti();uniOffer()})}
 else if(t==='University'){S.degrees.push(S.school.major);log(`I graduated with a degree in ${S.school.major}! 🎓`,'big');S.school=null;Q.push(()=>{confetti();gradOffer()})}
 else{const k=S.school.key;S.degrees.push(k);log(`I graduated from ${GRAD[k].n}! ${GRAD[k].icon}`,'big');S.school=null;Q.push(confetti)}
}

function tuition(base){let c=base;if(has('scholar'))c/=2;if(S.st.smarts>=85&&chance(.6+L())){return{c:0,msg:'I earned a full scholarship! 🏅'}}const par=ppl(['Mother','Father']);if(has('trust')&&par.length)return{c:0,msg:'My parents paid my tuition.'};if(S.money>=c)return{c,msg:`I paid ${fmt(c)} in tuition.`,cash:1};return{c,msg:`I took out ${fmt(c)} in student loans.`,loan:1}}
function enrollUni(m){const t=tuition(100000);if(t.cash)S.money-=t.c;if(t.loan)S.debt+=t.c;S.school={type:'University',major:m,left:4,perf:60};log(`I enrolled at university to study ${m}. ${t.msg}`,'good');closeSheet()}
function enrollGrad(k){const g=GRAD[k];if(S.st.smarts<g.smarts&&!chance(.15+L())){result(g.n,`I was rejected from ${g.n}. Maybe hit the library more.`,'📭');return}const t=tuition(g.cost);if(g.cost===0)t.msg='It is fully funded with a stipend.';if(t.cash)S.money-=t.c;if(t.loan)S.debt+=t.c;S.school={type:g.n,key:k,left:g.y,perf:60};result(g.n,`I was accepted to ${g.n}! ${t.msg}`,g.icon)}
function uniOffer(){const w=el('div');w.append(el('p','evt-text','High school is done. What now?'));w.append(sec('Pick a university major'));MAJORS.forEach(m=>w.append(opt('🎓',m,'4 years',()=>enrollUni(m))));w.append(sec('Or'));w.append(opt('💼','Skip college and get a job','',()=>{log('I decided to skip college.');closeSheet()}));w.append(opt('🎒','Take a gap year','',()=>{S.st.happy+=8;log('I took a gap year to travel and figure things out. 🌍','good');closeSheet()}));sheet('Graduation 🎓',w,true)}
function gradOffer(){const w=el('div');w.append(el('p','evt-text','Congrats, grad! Want to keep studying?'));Object.entries(GRAD).forEach(([k,g])=>{const ok=!g.req||g.req.some(d=>S.degrees.includes(d));w.append(opt(g.icon,g.n,`${g.y} years · ${g.cost?fmt(g.cost):'funded'} · ${ok?'needs '+g.smarts+' smarts':'needs '+g.req.join(' or ')+' degree'}`,()=>{if(!ok)return toast('You need a '+g.req.join(' or ')+' degree.');enrollGrad(k)},{cls:ok?'':'locked'}))});w.append(opt('💼','Start my career','',()=>{closeSheet()},{cls:'primary'}));sheet('Grad School?',w,!sheetOpen)}

function die(cause){S.alive=false;S.cause=cause;log(`I died at age ${S.age} from ${cause}. 🕊️`,'bad')}

 });

function wed(p,kind,cost){if(S.money<cost&&cost>500)return 'You could not afford that. Maybe a smaller wedding?';S.money-=cost;p.role='Spouse';p.since=S.age;p.rel=clamp(p.rel+15);E({happy:15+Math.round(cost/20000)});Q.push(confetti);log(`I married ${p.name} with a ${kind}! 💒`,'big');if(FM()){S.faith=clamp(S.faith+10);log('We had our very first kiss at the altar. The whole church cheered. 💋','big');return `You married ${first(p.name)} and shared your first kiss at the altar. The church went wild.`}return `You married ${first(p.name)}. Best day of your life.`}
function endIt(p){S.rel=S.rel.filter(r=>r!==p);E({happy:-14});if(p.role==='Spouse'){const l=Math.max(0,S.money*.5);S.money-=l;log(`${p.name} and I divorced. I lost ${fmt(l)}.`,'bad');return `The divorce is final. You lost ${fmt(l)} in the settlement.`}log(`${p.name} and I broke up.`,'bad');return `You and ${first(p.name)} broke up.`}

function meet(pref){const g=pref==='men'?'male':pref==='women'?'female':pick(['male','female']);return{id:uid(),name:pick(g==='male'?MALE:FEMALE)+' '+pick(LAST),gender:g,age:Math.max(16,S.age+rnd(-4,4)),looks:rnd(20,99),smarts:rnd(20,99),job:pick(['nurse','barista','engineer','artist','teacher','chef','lawyer','student','zookeeper','photographer','pilot','designer']),rel:60,alive:true}}
function addPartner(p){p.role='Partner';p.since=S.age;delete p.looks;delete p.smarts;S.rel.push(p);S.st.happy+=8}

 w.append(el('label','lb','Type'));const ts=el('select');ts.innerHTML=pr.types.map(t=>`<option>${t}</option>`).join('');w.append(ts);

  S.job.perf=clamp(S.job.perf+Math.round((q-48)/3));E({happy:q>=62?6:q<45?-4:1,fame:c.fame?Math.round(q/10):0});

  log(`My ${pr.n.toLowerCase()} "${x.n}" was ${qLabel(q)==='Flop'?'a flop':'a '+qLabel(q).toLowerCase()} (${x.score}/10). ${pr.ic}`,q>=78?'big':q<45?'bad':'good');if(q>=78)Q.push(confetti);

function crimeSheet(){P();if(S.jail)return prisonSheet();const w=el('div');w.append(el('div','info','Crime pays sometimes. Getting caught means court, and maybe prison. Your karma will drop either way.'));
 CRIMES.forEach(([ic,n,age,base,loot,sent])=>w.append(opt(ic,n,`Age ${age}+`,()=>{if(S.age<age)return toast(`You must be ${age}.`);if(!once('crime'))return;const p=base+(S.st.smarts-50)/250+L();E({karma:-rnd(4,10)});sin('crime',8);
  if(chance(p)){const g=rnd(loot[0],loot[1]);S.money+=g;log(`I got away with a ${n.toLowerCase()} and made ${fmt(g)}.`,'');fix();act(n,`You got away with it. +${fmt(g)}. Nobody saw a thing... probably.`,'😈')}
  else{fix();arrest(n,rnd(sent[0],sent[1]))}},{cls:S.age<age?'locked':''})));

function arrest(crime,years){log(`I was arrested for ${crime.toLowerCase()}. 🚨`,'bad');const w=el('div');w.append(el('div','evt-icon','🚨'),el('p','evt-text',`You were caught! The charge: <b>${crime}</b>. How do you handle court?`));
 const verdict=(bonus,cost)=>{if(cost&&S.money<cost)return toast('Not enough money.');S.money-=cost;const free=years===0||chance(.25+bonus+L());if(free){log('The judge let me go. 😮‍💨','good');fix();return act('Court','Not guilty! You walked out free.','⚖️')}
  const y=Math.max(1,years);S.jail=y;if(S.job){log(`I lost my job as ${CAR[S.job.id].lv[S.job.lvl][0]}.`,'bad');S.job=null}if(S.school&&S.school.type!=='Elementary School'&&S.school.type!=='Middle School')S.school=null;const p=partner();if(p&&chance(.4)){S.rel=S.rel.filter(r=>r!==p);log(`${p.name} left me.`,'bad')}
  log(`I was sentenced to ${y} year${y===1?'':'s'} in prison. ⛓️`,'bad');E({happy:-20});fix();result('Sentenced',`Guilty. You were sentenced to <b>${y} year${y===1?'':'s'}</b> in prison.`,'⛓️')};
 w.append(opt('👔','Hire a top lawyer',fmt(25000),()=>verdict(.35,25000)));w.append(opt('🧑‍⚖️','Public defender','Free',()=>verdict(.1,0)));w.append(opt('🙇','Plead guilty','Shorter sentence',()=>{years=Math.ceil(years/2);verdict(0,0)}));
 sheet('Arrested 🚨',w,true)}

 w.append(opt('🕳️','Attempt an escape','Risky',()=>{if(!once('escape'))return;if(chance(.18+S.st.smarts/400+L())){S.jail=0;S.flags.escaped=1;log('I escaped from prison! 🏃','big');E({karma:-5});fix();act('Escape','You slipped out during laundry duty. You are free!','🏃')}else{S.jail+=2;E({health:-8});fix();act('Escape','Caught! Two years were added to your sentence.','🚨')}}));

const HEIRS=['Spouse','Partner','Fiancé','Fiancée','Son','Daughter','Grandson','Granddaughter','Mother','Father','Sister','Brother','Friend'];
function willShares(){const live=S.rel.filter(r=>r.alive);const out={};let charity=0;
 if(S.will&&S.will.shares){Object.entries(S.will.shares).forEach(([id,pct])=>{if(live.some(r=>r.id===id)&&pct>0)out[id]=pct/100});charity=(S.will.charity||0)/100;return{out,charity,custom:true}}
 const sp=live.find(r=>r.role==='Spouse');const ks=live.filter(r=>['Son','Daughter'].includes(r.role));
 if(sp&&ks.length){out[sp.id]=.5;ks.forEach(k=>out[k.id]=.5/ks.length)}else if(sp)out[sp.id]=1;else if(ks.length)ks.forEach(k=>out[k.id]=1/ks.length);
 return{out,charity,custom:false}}
function willSheet(){const w=el('div');const live=S.rel.filter(r=>r.alive&&HEIRS.includes(r.role)).sort((a,b)=>HEIRS.indexOf(a.role)-HEIRS.indexOf(b.role));const cur=(S.will&&S.will.shares)||{};const vals={};
 w.append(el('div','info','<b>📜 Your will</b><br>Decide who gets what when you die. Anything you leave unassigned goes to the government. With no will, your spouse gets half and your kids split the rest.'));
 const total=el('div','info');const upd=()=>{const t=Object.values(vals).reduce((a,b)=>a+b,0);total.innerHTML=`Total assigned: <b style="color:${t>100?'var(--bad)':'var(--good)'}">${t}%</b>${t>100?' (over 100%, it will be scaled down)':t<100?` · ${100-t}% goes to the government`:''}<br>Current estate: ${fmt(Math.max(0,net()))}`};
 const row=(id,label,sub,v)=>{vals[id]=v;const lab=el('label','lb',`${label} · <span>${v}%</span>`);const r=el('input');r.type='range';r.min=0;r.max=100;r.step=5;r.value=v;r.oninput=()=>{vals[id]=+r.value;lab.querySelector('span').textContent=r.value+'%';upd()};w.append(lab);if(sub)w.append(el('div','tiny',sub));w.append(r)};
 if(!live.length)w.append(el('div','info','You have nobody to leave things to yet. You can still give to charity.'));
 live.forEach(r=>row(r.id,r.name,`${r.role} · age ${r.age}`,cur[r.id]||0));row('charity','🎗️ Charity','',(S.will&&S.will.charity)||0);
 w.append(total);upd();
 w.append(opt('💾','Save my will','',()=>{let t=Object.values(vals).reduce((a,b)=>a+b,0);const k=t>100?100/t:1;const shares={};Object.entries(vals).forEach(([id,v])=>{if(id!=='charity'&&v>0)shares[id]=Math.round(v*k)});S.will={shares,charity:Math.round((vals.charity||0)*k),age:S.age};log('I updated my will. 📜');fix();act('Will saved','Your will is signed and filed. 📜','📜')},{cls:'primary'}));
 if(S.will)w.append(opt('🗑️','Tear up my will','Go back to the default split',()=>{S.will=null;log('I tore up my will.');fix();act('Will','Your will is gone. The default split applies again.','🗑️')},{cls:'danger'}));
 sheet('Write a Will 📜',w)}
function estateLines(){const estate=Math.max(0,net());const {out,charity}=willShares();const lines=Object.entries(out).map(([id,f])=>{const r=S.rel.find(x=>x.id===id);return r?`${r.name} (${r.role}): ${fmt(estate*f)}`:''}).filter(Boolean);if(charity>0)lines.push(`Charity: ${fmt(estate*charity)}`);return lines}
function continueAs(h,alive=false){const estate=Math.max(0,net());const {out}=willShares();const inh=alive?0:Math.round(estate*(out[h.id]||0));const deceased=S;const spouse=S.rel.find(r=>r.role==='Spouse'&&r.alive);const gen=S.gen+1;const parts=h.name.split(' ');
 newLife({name:h.name,gender:h.gender,last:parts[parts.length-1],city:deceased.city,born:deceased.born+deceased.age-h.age,gen,noFamily:true,mode:deceased.mode});
 S.age=h.age;S.money+=inh;S.st.smarts=clamp(S.st.smarts);
 S.rel.push({id:uid(),name:deceased.name,role:deceased.gender==='male'?'Father':'Mother',gender:deceased.gender,age:deceased.age,rel:h.rel,alive:alive});
 if(spouse)S.rel.push({...spouse,role:spouse.gender==='male'?'Father':'Mother',rel:rnd(50,90)});
 deceased.rel.filter(r=>(r.role==='Son'||r.role==='Daughter')&&r.id!==h.id).forEach(s=>S.rel.push({...s,role:s.gender==='male'?'Brother':'Sister',rel:rnd(40,80)}));
 const a=S.age;if(a>=5&&a<11)S.school={type:'Elementary School',left:11-a,perf:60};else if(a>=11&&a<14)S.school={type:'Middle School',left:14-a,perf:60};else if(a>=14&&a<18)S.school={type:'High School',left:18-a,perf:60};
 if(a>=18)S.degrees.push('HS');if(a>=23&&chance(.6))S.degrees.push(pick(MAJORS));
 if(a>=22&&chance(.7)){const opts=CAREER_LIST.filter(c=>!meets(c).length&&!c.fame);if(opts.length){const c=pick(opts);S.job={id:c.id,lvl:Math.min(c.lv.length-1,Math.floor((a-22)/10)),perf:55,years:rnd(1,8)};S.jobsHeld.push(c.id)}}
 if(alive){log(`I am ${S.name}, child of ${deceased.name}. The story now follows me. 🔄`,'big')}
 else{log(`I am ${S.name}, child of ${deceased.name}. Generation ${gen} begins. 🌳`,'big');log(inh?`I inherited ${fmt(inh)} from my parent's estate.`:`My parent's will left me nothing.`,inh?'good':'bad')}
 checkAch();save();closeSheet();render()}
function switchSheet(k){const w=el('div');w.append(el('div','evt-icon','🔄'),el('p','evt-text',`Switch to living as <b>${k.name}</b> (age ${k.age})?<br><br>${first(S.name)} stays alive in their life as their ${S.gender==='male'?'father':'mother'}. ${first(k.name)} starts with their own money, not yours.`));
 w.append(opt('🔄',`Become ${first(k.name)}`,'',()=>continueAs(k,true),{cls:'primary'}));w.append(opt('','Stay as '+first(S.name),'',closeSheet));sheet('Switch Lives',w)}
function startScreen(){const w=el('div');w.append(el('div','title','Another Life'));w.append(el('div','tag','Every choice writes your story. One year at a time.'));
 let g=pick(['male','female']);
 w.append(el('label','lb','Gender'));const gs=el('select');gs.innerHTML='<option value="male">Male</option><option value="female">Female</option>';gs.value=g;w.append(gs);
 w.append(el('label','lb','First name'));const fn=el('input');fn.type='text';fn.value=pick(g==='male'?MALE:FEMALE);w.append(fn);
 w.append(el('label','lb','Last name'));const ln=el('input');ln.type='text';ln.value=pick(LAST);w.append(ln);
 w.append(el('label','lb','Life mode'));const md=el('select');md.id='lifeMode';md.innerHTML='<option value="classic">🎲 Classic</option><option value="faith">⛪ Faith & Family (satire)</option>';w.append(md);
 w.append(el('label','lb','Birthplace'));const cs=el('select');cs.innerHTML=CITIES.map(c=>`<option>${c}</option>`).join('');cs.value=pick(CITIES);w.append(cs);
 gs.onchange=()=>{fn.value=pick(gs.value==='male'?MALE:FEMALE)};
 const stats={};
 if(has('creator')){w.append(sec('🪄 Creator Mode: design your stats'));['health','happy','smarts','looks'].forEach(k=>{stats[k]=rnd(50,90);w.append(el('label','lb',`${k} <span id="sv_${k}">${stats[k]}</span>`));const r=el('input');r.type='range';r.min=0;r.max=100;r.value=stats[k];r.oninput=()=>{stats[k]=+r.value;$('#sv_'+k).textContent=r.value};w.append(r)})}
 w.append(opt('🎲','Randomize','',()=>{gs.value=pick(['male','female']);fn.value=pick(gs.value==='male'?MALE:FEMALE);ln.value=pick(LAST);cs.value=pick(CITIES)}));
 w.append(opt('','Be born ✨','',()=>{newLife({mode:md.value,name:(fn.value.trim()||'Alex')+' '+(ln.value.trim()||'Smith'),gender:gs.value,last:ln.value.trim()||'Smith',city:cs.value,stats:has('creator')?stats:null});closeSheet()},{cls:'primary'}));
 w.append(opt('⭐',`Upgrades (${M.sandbox?'∞':M.points} points)`,'Spend Life Points before you start',upgradeSheet));
 sheet('New Life',w,true)}

$('#ageBtn').onclick=()=>{if(sheetOpen&&isSide()&&!sheetForced)closeSheet();ageUp()};
$('#againBtn').onclick=()=>{if(sheetOpen||!lastMenu||!S.alive)return;const m=lastMenu;beep(520,.05);curNav={key:'again:'+m.name,name:m.name,go:m.go,title:null};navStack=(m.stack||[]).slice();if(!navStack.length&&lastSub[m.name]&&lastSub[m.name].title)navStack=[Object.assign({},lastSub[m.name],{parentEntry:{key:'p:'+m.name,name:m.name,go:m.go,title:m.title,forced:false}})];m.go()};
document.querySelectorAll('nav button[data-a]').forEach(b=>b.onclick=()=>{if(!S)return;if(sheetOpen){if(isSide()&&!sheetForced)closeSheet();else return}if(!S.alive)return showDeath();({job:jobSheet,assets:assetSheet,rel:relSheet,act:actSheet})[b.dataset.a]()});

function dockSheet(){const w=el('div');w.append(el('div','info','Dock the game to one side so a video can play on the other. Drag the slider until the game and your video both fit.'));
 w.append(sec('Position'));[['left','⬅️','Dock left'],['right','➡️','Dock right'],[null,'⏺️','Center (no dock)']].forEach(([v,ic,l])=>w.append(opt(ic,l,'',()=>{M.dock=v;saveMeta();applySide();dockSheet()},{rt:M.dock===v?'✅':''})));
 w.append(sec('Game width'));const val=el('div','mini',`<span>Narrower</span><b id="dwv">${M.dockw||52}% of the screen</b><span>Wider</span>`);const r=el('input');r.type='range';r.min=35;r.max=80;r.value=M.dockw||52;
 r.oninput=()=>{M.dockw=+r.value;$('#dwv').textContent=r.value+'% of the screen';applySide()};r.onchange=()=>saveMeta();w.append(val,r);
 w.append(sec('Space for your video'));const vv=el('div','mini',`<span>None</span><b id="vhv">${M.vidh==null?40:M.vidh}% of the height</b><span>More</span>`);const vr=el('input');vr.type='range';vr.min=0;vr.max=75;vr.value=M.vidh==null?40:M.vidh;
 vr.oninput=()=>{M.vidh=+vr.value;$('#vhv').textContent=vr.value+'% of the height';applySide()};vr.onchange=()=>saveMeta();w.append(vv,vr);
 w.append(el('div','info','The at-a-glance panel (job, people, money, ribbons) fills the free side under your video. Set this to match your video\'s height.'));
 if(!M.dock)w.append(el('div','info','Pick Dock left or Dock right to use these sliders.'));
 w.append(opt('','Done','',closeSheet,{cls:'primary'}));sheet('Dock 📺',w)}

$('#btnSide').onclick=()=>{if(M.dock&&!M.side)toast('Undock first to use side view.');M.side=!M.side;saveMeta();applySide();toast(!M.side?'Side view off.':WIDE()?'Side view on: menus open next to your game.':'Side view is on, but this screen is too narrow. Turn your device sideways or widen the window.')};

addEventListener('resize',applySide);applySide();

$('#btnRewind').onclick=()=>{if(!has('rewind'))return;if(!PREV)return toast('Nothing to rewind yet.');if(S.rewinds<=0)return toast('No rewinds left this life.');const r=S.rewinds-1;S=JSON.parse(PREV);S.rewinds=r;PREV=null;Q=[];if(sheetOpen){$('#sheet').classList.add('hidden');sheetOpen=false}log('⏪ I went back in time...');beep(300,.3,'sawtooth');save();render()};
